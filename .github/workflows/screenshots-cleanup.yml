name: Cleanup Screenshot Artifacts

on:
  pull_request:
    types: [closed]
    branches: [master]
  schedule:
    # Run daily at 03:00 UTC to clean up old artifacts
    - cron: '0 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  cleanup-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Delete screenshot comparison branch
        uses: actions/github-script@v9
        with:
          script: |
            const branch = `screenshots-diff-pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch ${branch}`);
            } catch (e) {
              console.log(`No branch to delete: ${e.message}`);
            }

      - name: Delete PR screenshot artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;
            const prefixes = [`screenshots-pr-${pr}`, `screenshots-changed-pr-${pr}`];

            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner, repo, per_page: 100,
            });
            const artifacts = data.artifacts || [];

            let deleted = 0;
            for (const artifact of artifacts) {
              if (prefixes.some(p => artifact.name === p || artifact.name.startsWith(p))) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                  console.log(`Deleted ${artifact.name} (${artifact.id})`);
                  deleted++;
                } catch (e) {
                  console.log(`Failed to delete ${artifact.name}: ${e.message}`);
                }
              }
            }
            console.log(`Deleted ${deleted} artifact(s) for PR #${pr}`);

  cleanup-old:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Delete old screenshot artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let page = 1;
            let allArtifacts = [];
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              if (!data.artifacts || data.artifacts.length === 0) break;
              allArtifacts = allArtifacts.concat(data.artifacts);
              if (allArtifacts.length >= data.total_count) break;
              page++;
            }

            const now = new Date();
            const maxAge = 3 * 24 * 60 * 60 * 1000; // 3 days
            let deleted = 0;
            let kept = 0;

            for (const artifact of allArtifacts) {
              if (!artifact.name.startsWith('screenshots-')) continue;
              const age = now - new Date(artifact.created_at);
              if (age > maxAge) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                  deleted++;
                } catch (e) {
                  console.log(`Failed to delete ${artifact.name}: ${e.message}`);
                }
              } else {
                kept++;
              }
            }
            console.log(`Deleted ${deleted} old screenshot artifacts, kept ${kept}`);

      - name: Delete old screenshot diff branches
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // List all branches matching the screenshot diff pattern
            const { data: refs } = await github.rest.git.listMatchingRefs({
              owner, repo,
              ref: 'heads/screenshots-diff-pr-',
            });

            // Get open PRs to avoid deleting branches for active PRs
            const { data: openPRs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });
            const openPRNumbers = new Set(openPRs.map(pr => pr.number));

            let deleted = 0;
            for (const ref of refs) {
              const branch = ref.ref.replace('refs/heads/', '');
              const match = branch.match(/^screenshots-diff-pr-(\d+)$/);
              if (match) {
                const prNum = parseInt(match[1]);
                if (!openPRNumbers.has(prNum)) {
                  try {
                    await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                    console.log(`Deleted stale branch ${branch}`);
                    deleted++;
                  } catch (e) {
                    console.log(`Failed to delete ${branch}: ${e.message}`);
                  }
                }
              }
            }
            console.log(`Deleted ${deleted} stale screenshot diff branch(es)`);
