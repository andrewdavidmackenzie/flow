name: Screenshot Tests

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'assets/screenshots/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'assets/screenshots/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.PAT_SCREENSHOT_BOT || github.token }}
          fetch-depth: 0

      - name: Skip if bot commit
        id: check_bot
        run: |
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable toolchain
        if: steps.check_bot.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup PATH
        if: steps.check_bot.outputs.skip != 'true'
        run: echo "PATH=$GITHUB_WORKSPACE/target/debug:$PATH" >> "$GITHUB_ENV"

      - name: Install system dependencies
        if: steps.check_bot.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get -y install libzmq3-dev libssl-dev libgtk-3-dev

      - name: Cache cargo registry and build
        if: steps.check_bot.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build (including flowstdlib)
        if: steps.check_bot.outputs.skip != 'true'
        run: make build

      - name: Save baseline screenshots from main
        if: steps.check_bot.outputs.skip != 'true' && github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/baseline
          git fetch --no-tags --depth=1 origin master
          if git ls-tree --name-only origin/master:assets/screenshots/ >/tmp/baseline-files 2>/dev/null; then
            while IFS= read -r f; do
              case "$f" in
                *.png)
                  git show "origin/master:assets/screenshots/$f" > "/tmp/baseline/$f"
                  ;;
              esac
            done < /tmp/baseline-files
          fi
          ls -la /tmp/baseline/ || echo "No baseline screenshots found"

      - name: Generate screenshots
        if: steps.check_bot.outputs.skip != 'true'
        run: |
          rm -f assets/screenshots/*.png
          cargo test -p flowedit screenshot_ -- --ignored --test-threads=1
          cargo test -p flowr --bin flowrgui screenshot_ -- --ignored --test-threads=1
          echo "Generated screenshots:"
          ls -la assets/screenshots/*.png

      - name: Upload screenshots artifact
        if: steps.check_bot.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          path: assets/screenshots/*.png
          retention-days: 90

      - name: Compare screenshots (PR only)
        if: steps.check_bot.outputs.skip != 'true' && github.event_name == 'pull_request'
        id: compare
        run: |
          CHANGED=""
          NEW=""
          REMOVED=""
          for f in assets/screenshots/*.png; do
            name=$(basename "$f")
            if [ -f "/tmp/baseline/$name" ]; then
              if ! cmp -s "$f" "/tmp/baseline/$name"; then
                CHANGED="$CHANGED $name"
              fi
            else
              NEW="$NEW $name"
            fi
          done
          for f in /tmp/baseline/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ ! -f "assets/screenshots/$name" ]; then
              REMOVED="$REMOVED $name"
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ] || [ -n "$NEW" ] || [ -n "$REMOVED" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if fork PR
        if: steps.check_bot.outputs.skip != 'true' && github.event_name == 'pull_request'
        id: fork_check
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "Skipping commit and inline images for fork PR"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit screenshots to PR branch
        if: steps.check_bot.outputs.skip != 'true' && github.event_name == 'pull_request' && steps.fork_check.outputs.is_fork != 'true'
        id: pr_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update screenshots"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: steps.check_bot.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          NEW: ${{ steps.compare.outputs.new }}
          REMOVED: ${{ steps.compare.outputs.removed }}
          HAS_CHANGES: ${{ steps.compare.outputs.has_changes }}
          PR_BRANCH: ${{ github.head_ref }}
          IS_FORK: ${{ steps.fork_check.outputs.is_fork }}
        with:
          script: |
            const changed = (process.env.CHANGED || '').trim().split(/\s+/).filter(Boolean);
            const added = (process.env.NEW || '').trim().split(/\s+/).filter(Boolean);
            const removed = (process.env.REMOVED || '').trim().split(/\s+/).filter(Boolean);
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const isFork = process.env.IS_FORK === 'true';
            const branch = process.env.PR_BRANCH;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}`;

            let body = '## Screenshot Comparison\n\n';
            if (!hasChanges) {
              body += 'No screenshot changes detected.\n';
            } else {
              body += `**${changed.length}** changed, **${added.length}** new, **${removed.length}** removed\n\n`;
              if (changed.length > 0) {
                body += '### Changed\n\n';
                for (const name of changed) {
                  if (isFork) {
                    body += `- \`${name}\`\n`;
                  } else {
                    const mainUrl = `${rawBase}/master/assets/screenshots/${name}`;
                    const prUrl = `${rawBase}/${branch}/assets/screenshots/${name}`;
                    body += `<details><summary><code>${name}</code></summary>\n\n`;
                    body += `| master | this PR |\n|---|---|\n`;
                    body += `| <img src="${mainUrl}" width="500"> | <img src="${prUrl}" width="500"> |\n\n`;
                    body += `</details>\n\n`;
                  }
                }
                if (isFork) body += '\n';
              }
              if (added.length > 0) {
                body += '### New\n\n';
                for (const name of added) {
                  if (isFork) {
                    body += `- \`${name}\`\n`;
                  } else {
                    const prUrl = `${rawBase}/${branch}/assets/screenshots/${name}`;
                    body += `<details><summary><code>${name}</code></summary>\n\n`;
                    body += `<img src="${prUrl}" width="500">\n\n`;
                    body += `</details>\n\n`;
                  }
                }
                if (isFork) body += '\n';
              }
              if (removed.length > 0) {
                body += '### Removed\n\n';
                for (const name of removed) {
                  body += `- \`${name}\`\n`;
                }
                body += '\n';
              }
              if (isFork) {
                body += '_Note: inline images unavailable for fork PRs. Download the artifacts to compare._\n\n';
              }
            }
            body += `\n[View workflow run](${runUrl})\n`;
            body += '\n<!-- screenshot-bot -->';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body && c.body.includes('<!-- screenshot-bot -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Commit screenshots (main only)
        if: steps.check_bot.outputs.skip != 'true' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "Update screenshots"
            git push
          fi
