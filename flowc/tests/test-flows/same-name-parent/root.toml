flow = "same-name-parent"

[[process]]
source = "context://args/get"

[[process]]
alias = "child"
source = "same-name-child"

[[connection]]
from = "get/string/1"
to = "child/message"

[[process]]
alias = "child2"
source = "same-name-child"

[[connection]]
from = "get/string/1"
to = "child2/message"

[[process]]
source = "context://stdio/stdout"
input.format = { always = "{}" }

[[connection]]
from = "child2/message"
to = "stdout/value"

[[connection]]
from = "child/message"
to = "stdout/value"